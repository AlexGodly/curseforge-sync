name: sync

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Modrinth slugs to sync (blank = all)
        required: false
      dry_run:
        description: Only list what would be uploaded
        type: boolean
        default: false
  schedule:
    - cron: "23 */6 * * *"

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload new Modrinth versions to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 sync.py ${{ inputs.projects }}
      - name: Upload queued files straight to CurseForge
        if: always()
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 upload.py
      - name: Remember what was uploaded
        if: always()
        run: |
          git config user.name "Alex Godly"
          git config user.email "AlexGodly@users.noreply.github.com"
          git add synced.json uploads/done.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "Synced files" && git push)
